name: Trigger Downstream

# 实际流程全在 kamalyes/deploy-pipeline 的 go-trigger-downstream.yml 里，所有 Go 库共用一份
#
# 下游清单**不需要配置**：共用流水线直接从真实依赖图推导出谁的 go.mod 直接 require 了
# 本模块，所以漏通知在机制上不可能发生
#
# 只认一级下游：带 // indirect 的传递依赖不算，它们由自己的直接上游在各自那一跳通知到
#
# 为什么不再手维护清单 —— 实测过的代价：go-pbmo v0.3.0 发布时，它那份手写清单里只有
# go-rpc-gateway，漏了直接依赖它的 go-wsc，而 go-wsc 的 master 在两分钟前刚因为
# go-pbmo 版本太旧而编译崩掉。修复就在两分钟后存在，却永远送不到
#
# 要覆盖默认行为才用变量：
#   单个变量   vars.GOLIB_DOWNSTREAM_REPOS
#   分节总表   vars.GOLIB_CONFIG 的 downstream_repos
#   全局总表   vars.PIPELINE_CONFIG 的 golib.downstream_repos
# 配了之后流水线仍会比对真实依赖图，缺漏就在 job summary 里点出来
#
# [EN] The downstream list needs no configuration: the shared pipeline derives it from which
# repositories require this module directly, so a missed notification cannot happen by
# oversight. A hand-maintained list once cost a broken default branch for a day -- the release
# that fixed it existed two minutes later but the list did not name the repository that needed
# it. Variables only override that default, and the pipeline still reports any gap

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要通知的版本，留空则用当前 tag 名"
        required: false
        type: string
      only_repos:
        description: "只通知这几个下游，逗号或空白分隔，可填多个（例 go-wsc go-rpc-gateway）；留空则通知推导出的全部"
        required: false
        type: string
      create_tag:
        description: "下游升完依赖后是否自动打 tag，从而把联动继续往下传"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    uses: kamalyes/deploy-pipeline/.github/workflows/go-trigger-downstream.yml@master
    with:
      version: ${{ inputs.version }}
      only-repos: ${{ inputs.only_repos }}
      create-tag: ${{ inputs.create_tag == true }}
    secrets:
      # 跨仓库 dispatch 用不了 GITHUB_TOKEN，它只对本仓库有效，所以这里必须有 App 或 PAT
      # [EN] GITHUB_TOKEN is scoped to its own repository and cannot dispatch across
      # repositories, so an App token or a PAT is required
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GH_GPA_TOKEN: ${{ secrets.GH_GPA_TOKEN }}
      PIPELINE_SECRETS: ${{ secrets.PIPELINE_SECRETS }}
