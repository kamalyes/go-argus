name: Lint

on:
  push:
    branches:
      - master
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: 🔎 Run go vet
        run: go vet ./...

      - name: 🧹 Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
          args: --timeout=5m --enable=govet,errcheck,staticcheck,ineffassign,unused,gosimple

      - name: 🔄 Run go fix (modernize)
        run: go fix ./...

      - name: 💅 Format code
        run: gofmt -w .

      - name: 📝 Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Auto-commit formatted code
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "🎨 style: auto-format code by gofmt and go fix"
          git push

      - name: ❌ Fail if unformatted in PR
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        run: |
          echo "Code is not formatted. Please run 'gofmt -w .' and 'go fix ./...' locally."
          echo "Changes needed:"
          git diff
          exit 1

      - name: ✅ Run go mod verify
        run: go mod verify

      - name: 📦 Check for go.mod/go.sum changes
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not up to date"
            git diff go.mod go.sum
            exit 1
          fi